<!DOCTYPE html>
<html>
<head>
    <title>HTML Lists</title>
</head>
<body>

    <h1>HTML Lists</h1>

    <h2>Unordered List</h2>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <h2>Ordered List</h2>

    <ol>
        <li>Belajar HTML</li>
        <li>Belajar CSS</li>
        <li>Belajar JavaScript</li>
    </ol>

</body>
</html>
